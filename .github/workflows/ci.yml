name: POS CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Test & Build Next.js POS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Run Frontend Build Verification
        run: npm run build

      - name: Run Key Cart & Stock Unit Tests
        run: npx jest tests/cart.test.js --passWithNoTests

  docker-build:
    name: Build & Push API Docker Container
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Express API Image
        run: |
          docker build -t boutique-pos-api:latest ./server
